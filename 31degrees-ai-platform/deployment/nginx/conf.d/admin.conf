# 管理后台服务配置
server {
    listen 80;
    server_name admin.31degrees.cn;  # 替换为实际域名

    # HTTP重定向到HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.31degrees.cn;  # 替换为实际域名

    # SSL配置
    ssl_certificate /etc/nginx/ssl/admin.31degrees.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/admin.31degrees.cn.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # 现代SSL配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000" always;

    # 管理后台反向代理
    location / {
        proxy_pass http://admin:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # 静态资源
    location /static/ {
        proxy_pass http://admin:8081/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # CSS和JS文件
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
        proxy_pass http://admin:8081;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # IP白名单（可选，限制管理后台访问）
    # allow 192.168.1.0/24;  # 内网IP段
    # allow 10.0.0.0/8;      # 内网IP段
    # deny all;

    # 基本安全设置
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}