# 生产环境配置
spring:
  profiles:
    active: prod
    
  # 数据库配置
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ai_platform?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8}
    username: ${SPRING_DATASOURCE_USERNAME:ai_user}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQL8Dialect

  # Redis配置
  redis:
    host: ${SPRING_REDIS_HOST:localhost}
    port: ${SPRING_REDIS_PORT:6379}
    password: ${SPRING_REDIS_PASSWORD:}
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 20
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# 服务器配置
server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
  tomcat:
    max-threads: 200
    min-spare-threads: 10

# 日志配置
logging:
  level:
    com.degrees31: INFO
    org.springframework.security: WARN
  file:
    name: /app/logs/application.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

# JWT配置
jwt:
  secret: ${JWT_SECRET:31degrees-ai-platform-jwt-secret-key-for-production-2025}
  expiration: 604800000  # 7天

# 阿里云OSS配置
aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT}
    accessKeyId: ${ALIYUN_OSS_ACCESS_KEY_ID}
    accessKeySecret: ${ALIYUN_OSS_ACCESS_KEY_SECRET}
    bucketName: ${ALIYUN_OSS_BUCKET_NAME}
    baseUrl: ${ALIYUN_OSS_BASE_URL:https://${ALIYUN_OSS_BUCKET_NAME}.${ALIYUN_OSS_ENDPOINT}}

# 百度AI配置
baidu:
  ai:
    apiKey: ${BAIDU_AI_API_KEY}
    secretKey: ${BAIDU_AI_SECRET_KEY}
    baseUrl: https://aip.baidubce.com

# 微信配置
wechat:
  miniprogram:
    appid: ${WECHAT_APPID}
    secret: ${WECHAT_SECRET}
  pay:
    mchId: ${WECHAT_PAY_MCH_ID}
    privateKeyPath: ${WECHAT_PAY_PRIVATE_KEY_PATH}
    merchantSerialNumber: ${WECHAT_PAY_MERCHANT_SERIAL_NUMBER}
    apiV3Key: ${WECHAT_PAY_API_V3_KEY}
    notifyUrl: https://api.31degrees.cn/api/payment/wechat/notify

# 应用配置
app:
  name: 31度文创精灵
  version: 1.0.0
  baseUrl: https://api.31degrees.cn

# 监控端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized