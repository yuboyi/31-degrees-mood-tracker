# 管理后台生产环境配置
spring:
  profiles:
    active: prod
    
  # 数据库配置
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ai_platform?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8}
    username: ${SPRING_DATASOURCE_USERNAME:ai_user}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      idle-timeout: 300000
      connection-timeout: 20000

  # JPA配置
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQL8Dialect

  # Thymeleaf配置
  thymeleaf:
    cache: true
    mode: HTML
    encoding: UTF-8
    servlet:
      content-type: text/html

  # Session配置
  session:
    timeout: 3600s
    cookie:
      max-age: 3600s
      http-only: true
      secure: true

# 服务器配置
server:
  port: 8081
  compression:
    enabled: true
  tomcat:
    max-threads: 100
    min-spare-threads: 5

# 日志配置
logging:
  level:
    com.degrees31: INFO
    org.springframework.security: WARN
  file:
    name: /app/logs/admin.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

# 管理后台配置
admin:
  name: 31度文创精灵管理后台
  version: 1.0.0
  sessionTimeout: 3600

# 监控端点
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always