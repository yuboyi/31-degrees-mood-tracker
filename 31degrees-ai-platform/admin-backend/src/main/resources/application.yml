# 31度文创精灵管理后台配置文件

server:
  port: 8081
  servlet:
    context-path: /admin
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: admin-backend
  
  # 数据源配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://localhost:3306/ai_platform?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      username: root
      password: 123456
      
      # 连接池配置
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      
      # 监控配置
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: /druid/*,*.js,*.gif,*.jpg,*.bmp,*.png,*.css,*.ico
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        reset-enable: false
        login-username: admin
        login-password: 123456
        allow: 127.0.0.1
  
  # Redis配置
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 2
      timeout: 30000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0
  
  # Thymeleaf模板配置
  thymeleaf:
    mode: HTML
    encoding: UTF-8
    servlet:
      content-type: text/html
    cache: false # 开发环境关闭缓存
    prefix: classpath:/templates/
    suffix: .html
  
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  
  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/*.xml
  type-aliases-package: com.degrees31.admin.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志配置
logging:
  level:
    com.degrees31.admin: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/admin-backend.log

# 管理后台相关配置
admin:
  # JWT配置
  jwt:
    secret: 31degrees_admin_secret_key_2025
    expire-time: 7200 # 2小时，单位：秒
    header: Authorization
    token-prefix: "Bearer "
  
  # 系统配置
  system:
    name: "31度文创精灵管理后台"
    version: "1.0.0"
    description: "AI绘画平台管理系统"
    author: "31度团队"
    
  # 文件存储配置
  file:
    upload-path: /data/uploads/admin/
    allowed-types: jpg,jpeg,png,gif,bmp,pdf,doc,docx,xls,xlsx
    max-size: 50MB
    
  # 分页配置
  page:
    default-size: 20
    max-size: 100

# 外部API配置（复用主系统的配置）
external:
  # 主系统API地址
  main-api:
    base-url: http://localhost:8080/api
    timeout: 30000